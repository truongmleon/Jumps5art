[workspace]
members = [
    "apps/photogenic/src-tauri",
    "crates/jumpstart-domain",
    "crates/jumpstart-protocol",
    "crates/jumpstart-storage",
    "crates/jumpstart-server",
]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.93"
publish = false
license = "LicenseRef-Proprietary"

[workspace.dependencies]
jumpstart-domain = { path = "crates/jumpstart-domain" }
jumpstart-protocol = { path = "crates/jumpstart-protocol" }
jumpstart-storage = { path = "crates/jumpstart-storage" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4", "v7", "serde"] }
blake3 = "1"
thiserror = "2"
rusqlite = { version = "0.41", features = ["bundled"] }
rustix = { version = "1.1", features = ["fs"] }
fs2 = "0.4"
tempfile = "3"
clap = { version = "4", features = ["derive"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = "warn"

[profile.release]
lto = "thin"
codegen-units = 1
