[workspace]
members = ["crates/jumpstart-domain"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.93"
publish = false
license = "LicenseRef-Proprietary"

[workspace.dependencies]
jumpstart-domain = { path = "crates/jumpstart-domain" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4", "v7", "serde"] }
blake3 = "1"
thiserror = "2"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = "warn"

[profile.release]
lto = "thin"
codegen-units = 1
