[package]
name = "jumpstart-server"
description = "Local metadata development commands for Jumpstart"
default-run = "jumpstart-server"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true

[dependencies]
clap.workspace = true
jumpstart-domain.workspace = true
jumpstart-storage.workspace = true
serde_json.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
blake3.workspace = true
jumpstart-protocol.workspace = true
rustix = { workspace = true, features = ["net", "process"] }
serde.workspace = true
tokio = { version = "1.53", features = ["io-util", "macros", "net", "rt", "signal", "time"] }

[dev-dependencies]
tempfile.workspace = true

[target.'cfg(target_os = "linux")'.dev-dependencies]
ed25519-dalek = "2.2"
rusqlite.workspace = true

[lints]
workspace = true
